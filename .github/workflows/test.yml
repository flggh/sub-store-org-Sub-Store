name: test

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'config/**'
      - '.node-version'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - 'config/**'
      - '.node-version'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
